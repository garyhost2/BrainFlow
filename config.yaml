# ══════════════════════════════════════════════════════════════════════════════
# BrainFlow v5 — central configuration (single source of truth)
# ══════════════════════════════════════════════════════════════════════════════

distribution:
  backend: auto                 # auto | nccl | gloo
  init_method: "env://"

data:
  hf_repo: "pscotti/mindeyev2"
  data_dir: "./mindeyev2_cache"
  tensor_cache: "all_subjects_tensors.pt"
  clip_cache: "all_subjects_clip_v2.pt"
  clip_patch_cache: "all_subjects_clip_patches_v2.pt"
  latent_cache: "all_subjects_latents_v2.pt"
  subjects: [1, 2, 3, 4, 5, 6, 7, 8]   # train on ALL subjects
  img_size: 256
  max_train: 999999
  max_test: 999999
  download_threads: 4
  force_rebuild: false

dataloader:
  batch_size_per_gpu: 96   # was 48; doubled to halve iterations per epoch
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  drop_last_train: true
  drop_last_test: false

model:
  enc_hidden: 1024
  enc_blocks: 4
  enc_drop: 0.15
  stem_drop: 0.15
  n_tokens: 64
  brain_dim: 1024
  token_drop_prob: 0.1
  stochastic_depth: 0.1
  unet_base_ch: 128
  attn_heads: 8
  time_emb_dim: 512
  latent_ch: 4
  latent_res: 32
  clip_dim: 768
  use_subject_heads: true
  subject_head_rank: 16
  use_ridge_init: true
  ridge_lambda: 1.0e3
  ridge_init_cache: "ridge_init.pt"

training:
  num_epochs: 150
  grad_accum: 4            # effective batch = per_gpu_batch * grad_accum * world_size (target >= 512)
  lr: 2.5e-4               # √2 scaled from 2.0e-4
  warmup_epochs: 10
  min_lr: 1.0e-5
  grad_clip: 1.0
  weight_decay: 0.05
  infonce_temp: 0.07
  lambda_align: 0.2        # was 0.5 — InfoNCE was dominating
  lambda_cfm: 1.0
  lambda_percep: 0.15          # weight for LPIPS/L1 loss (0.0 = disabled)
  lambda_pixel: 0.3            # pixel-space L1 low-level supervision
  percep_t_min: 0.5            # hard floor for low-level decode path
  percep_t_power: 1.0          # soft t-weight exponent (higher t => higher weight)
  vfm_kl_weight: 0.0           # disabled — enable later when model is stable
  vfm_kl_anneal_epochs: 50
  percep_loss: "lpips"         # none | lpips | l1
  sigma_min: 1.0e-4
  cfg_drop_prob: 0.10      # was 0.20
  cfg_scale: 2.0
  fmri_noise_std: 0.05
  fmri_mask_prob: 0.0      # was 0.05
  mixup_alpha: 0.0         # was 0.2 (mixup is incompatible with hrf source; disabled globally)
  use_mixco: true          # CLIP-space MixCo/BiMixCo for alignment loss
  mixco_alpha: 0.3
  ema_decay: 0.999         # was 0.9995 (faster ramp-up)
  ema_start: 4000          # was 200 (wait ~2 epochs before EMA)
  eval_freq: 5
  eval_batches: 32         # was 9999 — cap training-time eval; full eval at last epoch
  stochastic_depth: 0.05   # was 0.1
  patience: 25
  min_epochs: 60
  log_every_n_steps: 50

inference:
  ode_steps: 20
  eval_ode_steps: 10       # faster eval during training (10-step Euler)
  eval_solver: "dpm2m"     # euler | midpoint | heun | dpm2m
  prior_ode_steps: 20      # ODE steps for CLIPPrior.sample() during inference
  use_clip_prior: true
  lambda_prior: 0.3

output:
  output_dir: "./outputs"
  experiment_name: "baseline"    # baseline | lpips | l1 | v6

wandb:
  wandb_project: "brainflow-v5"
  wandb_run_name: "v5-multisubject"
  wandb_mode: "offline"         # offline by default; run `wandb sync` after training

# ── New geometry / schedule / OT options (Items 1–3) ──────────────────────────
geometry:
  clip_prior_geometry: "sphere"      # "euclidean" | "sphere"

schedule:
  t_schedule: "logit_normal"         # "linear" | "cosine" | "logit_normal"
  logit_normal_m: 0.0
  logit_normal_s: 1.0

ot:
  use_ot_coupling: true              # enable minibatch OT for Stage 2B VAE flow
  ot_reg: 0.05
  ot_iters: 50
