# Phase 3 SDPrior: fMRI -> BrainEncoder tokens -> ClipPrior -> frozen decoder

distribution:
  backend: auto
  init_method: "env://"

data:
  data_dir: "./mindeyev2_cache"
  subjects: [1]

dataloader:
  batch_size_per_gpu: 16
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
  drop_last_train: true
  drop_last_test: false

model:
  enc_hidden: 1024
  enc_blocks: 4
  enc_drop: 0.15
  stem_drop: 0.15
  n_tokens: 64
  brain_dim: 1024
  clip_dim: 768
  attn_heads: 8
  cfg_drop_prob: 0.10

training:
  num_epochs: 100
  grad_accum: 4
  lr: 1.0e-4
  warmup_epochs: 5
  min_lr: 1.0e-5
  grad_clip: 1.0
  weight_decay: 0.05
  infonce_temp: 0.07
  lambda_align: 0.10
  lambda_cfm: 1.0
  ema_decay: 0.999
  ema_start: 200
  eval_freq: 5
  eval_batches: 32
  patience: 25
  min_epochs: 60
  sigma_min: 1.0e-4

inference:
  prior_ode_steps: 20
  cfg_scale: 1.5
  prior_dim: 512
  prior_blocks: 6
  decoder_model_id: "stabilityai/stable-diffusion-2-1-unclip"
  decoder_num_inference_steps: 30
  decoder_guidance_scale: 7.5

geometry:
  clip_prior_geometry: "euclidean"

output:
  output_dir: "./outputs"
  experiment_name: "phase3_sdprior"

wandb:
  wandb_project: "brainflow-v5"
  wandb_run_name: "phase3_sdprior"
  wandb_mode: "disabled"

# select the additive method path
method: "dit"
training_stage: "sdprior"
