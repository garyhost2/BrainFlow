# ══════════════════════════════════════════════════════════════════════════════
# BrainFlow — Central Configuration
# ══════════════════════════════════════════════════════════════════════════════
# Launch command:
#   python launch.py --nproc_per_node=<num_gpus> dataloader.py
# Or single-GPU / CPU:
#   python dataloader.py


# ── Distribution ──────────────────────────────────────────────────────────────
distribution:
  # Number of GPUs (or CPU workers) to distribute across.
  # Examples: 1 (single GPU/CPU), 2 (2× T4), 4, 8 ...
  num_gpus: 2

  # DDP communication backend.
  # "auto"  → nccl if CUDA is available, gloo otherwise  (recommended)
  # "nccl"  → fastest for GPU↔GPU (requires CUDA build)
  # "gloo"  → CPU-only or mixed environments
  backend: auto

  # Process-group init method. "env://" reads MASTER_ADDR / MASTER_PORT /
  # RANK / WORLD_SIZE from the environment (set automatically by launch.py).
  init_method: "env://"


# ── Data ──────────────────────────────────────────────────────────────────────
data:
  # HuggingFace dataset repo (do not change unless you mirror the dataset)
  hf_repo: "pscotti/mindeyev2"

  # Local directory where raw files are downloaded and the tensor cache lives
  data_dir: "./mindeyev2_cache"

  # Filename of the serialized tensor cache (relative to data_dir)
  tensor_cache: "all_subjects_tensors.pt"

  # Which subjects to load. Any non-empty subset of [1..8].
  subjects: [1, 2, 3, 4, 5, 6, 7, 8]

  # Image resolution (square). Loaded COCO images are resized to this.
  img_size: 256

  # Maximum number of training / test trials to use per subject
  max_train: 8859
  max_test: 982

  # Parallel download threads per subject (used during the slow-path first run)
  download_threads: 4

  # Set to true to ignore an existing tensor cache and rebuild from scratch
  force_rebuild: false


# ── DataLoader ────────────────────────────────────────────────────────────────
dataloader:
  # Samples per GPU per step.
  # Effective (global) batch size = batch_size_per_gpu × num_gpus
  batch_size_per_gpu: 32

  # CPU worker processes per GPU.
  # Rule of thumb: (total CPU cores) / num_gpus, capped at ~8.
  # Set to 0 to load data in the main process (useful for debugging).
  num_workers: 4

  # How many batches each worker pre-loads ahead of time.
  # Higher = more RAM usage, smoother GPU utilisation.
  # Ignored when num_workers == 0.
  prefetch_factor: 2

  # Allocate data in page-locked CPU memory → faster async DMA to GPU.
  pin_memory: true

  # Keep worker processes alive between epochs (avoids spawn overhead).
  persistent_workers: true

  # Drop the last incomplete batch in training (keeps batch sizes uniform).
  drop_last_train: true

  # Whether to drop the last incomplete batch in evaluation.
  drop_last_test: false


# ── Training loop (skeleton) ──────────────────────────────────────────────────
training:
  num_epochs: 3

  # Print a progress line every N steps (rank 0 only)
  log_every_n_steps: 50